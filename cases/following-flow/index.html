<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关注列表交互 · UI 动效实验室</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#1f2430;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}main{max-width:940px;margin:auto;padding:32px 20px 80px}a{color:#5851be}h1{font-size:28px;margin:24px 0 8px}p{color:#697080;line-height:1.6}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}.panel{background:white;border:1px solid #e4e7ed;border-radius:20px;padding:24px;min-height:450px;box-shadow:0 12px 35px #202b4408}.panel h2{font-size:18px;margin:0 0 20px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #edf0f4;padding:18px 0}.row:first-of-type{border-top:0}.name{font-weight:650}.meta{font-size:12px;color:#818897;margin-top:7px}.follow{border:1px solid #5c55bd;color:#5c55bd;background:white;border-radius:9px;padding:8px 14px;cursor:pointer;min-width:70px}.follow[aria-pressed=true]{color:#70788a;border-color:#d6dae2;background:#f7f8fa}.tabs{display:flex;border-bottom:1px solid #e7eaf0;gap:26px;margin:0 0 16px}.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:#737b8c;padding:0 0 12px;font:inherit;cursor:pointer}.tabs button[aria-selected=true]{color:#514ab3;border-bottom-color:#514ab3;font-weight:650}.tag{display:inline-block;font-size:11px;border-radius:5px;padding:4px 7px;margin-top:8px}.new{background:#e9f3ee;color:#287a54}.track{background:#eef0fb;color:#505ba9}.closed{background:#f2f3f5;color:#737b89}.empty{padding:48px 6px;text-align:center;color:#777f8f;line-height:1.7}.hint{font-size:13px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222836;color:white;padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}@media(max-width:650px){.layout{grid-template-columns:1fr}.panel{min-height:360px}}
</style></head><body><main><a href="../../index.html">← 返回动效实验室</a><h1>关注列表交互</h1><p>从案例入口关注一个标的，再到“我的关注”查看。点击“已关注”可直接取关；以下名称和内容均为虚构示例。</p><div class="layout">
<section class="panel" aria-label="发现案例"><h2>发现案例</h2><div id="discover"></div></section>
<section class="panel" aria-label="我的关注"><div class="tabs" role="tablist"><button id="allTab" role="tab" aria-selected="true" aria-controls="list">全部</button><button id="followingTab" role="tab" aria-selected="false" aria-controls="list">我的关注 <span id="count">0</span></button></div><div id="list" role="tabpanel"></div></section>
</div><p class="hint">交互重点：按钮原位切换关注状态；列表与数量同步；空状态给出返回发现页的方向。</p></main><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const items=[{id:1,name:"星河科技",code:"示例 A01",tag:"新增案例",kind:"new"},{id:2,name:"青禾能源",code:"示例 B02",tag:"案例跟踪",kind:"track"},{id:3,name:"云岭材料",code:"示例 C03",tag:"清仓",kind:"closed"}];
const followed=new Set();let tab="all",toastTimer;
const d=document.getElementById("discover"),l=document.getElementById("list"),count=document.getElementById("count");
function label(item){return '<span class="tag '+item.kind+'">'+item.tag+'</span>'}
function button(item){let on=followed.has(item.id);return '<button class="follow" data-id="'+item.id+'" aria-pressed="'+on+'" aria-label="'+(on?"取消关注":"关注")+item.name+'">'+(on?"已关注":"关注")+'</button>'}
function row(item,withButton){return '<div class="row"><div><div class="name">'+item.name+'</div><div class="meta">'+item.code+'</div>'+label(item)+'</div>'+(withButton?button(item):"")+'</div>'}
function render(){d.innerHTML=items.map(x=>row(x,true)).join("");const shown=tab==="following"?items.filter(x=>followed.has(x.id)):items;l.innerHTML=shown.length?shown.map(x=>row(x,tab==="following")).join(""):'<div class="empty">暂时没有关注的案例<br>可以在左侧“发现案例”中添加</div>';count.textContent=followed.size;for(const [id,name] of [["allTab","all"],["followingTab","following"]])document.getElementById(id).setAttribute("aria-selected",String(tab===name))}
document.addEventListener("click",e=>{const b=e.target.closest(".follow");if(b){const id=Number(b.dataset.id),item=items.find(x=>x.id===id);let added;if(followed.has(id)){followed.delete(id);added=false}else{followed.add(id);added=true}render();const t=document.getElementById("toast");t.textContent=added?"已关注 "+item.name:"已取消关注 "+item.name;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),1800)}});
document.getElementById("allTab").onclick=()=>{tab="all";render()};document.getElementById("followingTab").onclick=()=>{tab="following";render()};render();
</script></body></html>
